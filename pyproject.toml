[project]
name = "palimpsest"
version = "0.1.0"
description = "SEC filings research assistant"
readme = "README.md"
authors = [
    { name = "Japharidze", email = "sergi.japharidze@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "typer>=0.27.1",
]

[project.scripts]
palim = "palimpsest.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
serc = ["src"]
