[project]
name = "palimpsest"
version = "0.1.0"
description = "SEC filings research assistant"
readme = "README.md"
authors = [
    { name = "Japharidze", email = "sergi.japharidze@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "edgartools>=5.53.0",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "lxml>=6.1.2",
    "ollama>=0.6.2",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "typer>=0.27.1",
]

[project.scripts]
palim = "palimpsest.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dbt-core>=1.12.3",
    "dbt-postgres>=1.11.0",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
serc = ["src"]
