<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Palimpsest pipeline</title>
  <desc id="desc">Data flows from the EDGAR API through ingestion into raw storage, then is parsed into Postgres, transformed by dbt, and consumed by a rule engine and an agent layer that feed the API and UI.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#888780" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g stroke="#888780" stroke-width="1.2" fill="none" marker-end="url(#a)">
    <line x1="180" y1="68" x2="215" y2="68"/>
    <line x1="370" y1="68" x2="405" y2="68"/>
    <line x1="560" y1="68" x2="595" y2="68"/>
    <path d="M675 96 L675 133 L105 133 L105 185"/>
    <line x1="180" y1="218" x2="215" y2="218"/>
    <line x1="370" y1="218" x2="405" y2="218"/>
    <line x1="560" y1="218" x2="595" y2="218"/>
    <path d="M290 246 L290 292 L675 292 L675 251"/>
  </g>

  <g stroke-width="1" rx="6">
    <rect x="30" y="40" width="150" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/>
    <rect x="215" y="40" width="150" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
    <rect x="405" y="40" width="150" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
    <rect x="595" y="40" width="150" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
    <rect x="30" y="190" width="150" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
    <rect x="215" y="190" width="150" height="56" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
    <rect x="405" y="190" width="150" height="56" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
    <rect x="595" y="190" width="150" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/>
  </g>

  <g font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="105" y="68" fill="#2C2C2A">EDGAR API</text>
    <text x="290" y="68" fill="#04342C">Ingestion</text>
    <text x="480" y="68" fill="#04342C">Raw storage</text>
    <text x="670" y="68" fill="#04342C">Postgres</text>
    <text x="105" y="218" fill="#04342C">dbt marts</text>
    <text x="290" y="218" fill="#26215C">Rule engine</text>
    <text x="480" y="218" fill="#26215C">Agent layer</text>
    <text x="670" y="218" fill="#2C2C2A">API and UI</text>
  </g>

  <g font-size="12" fill="#888780" text-anchor="middle">
    <text x="197" y="60">fetch</text>
    <text x="387" y="60">store</text>
    <text x="577" y="60">parse</text>
    <text x="390" y="126">transform</text>
    <text x="387" y="210">escalate</text>
    <text x="482" y="286">flags</text>
  </g>
</svg>
